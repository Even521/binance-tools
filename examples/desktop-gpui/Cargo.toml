[package]
name = "desktop-gpui"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
default = []
cuda = ["evm-wallet/cuda"]

[build-dependencies]
winresource = "0.1"

[package.metadata.packager]
product-name = "Binance Tools"
identifier = "com.binance-tools.desktop"
icons = ["assets/app.ico"]

[dependencies]
anyhow = "1.0"
binance_tools = { path = "../.." }
evm-wallet = { path = "../../crates/evm-wallet" }
ocr-rs = { path = "../../crates/ocr-rs" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "png"] }

gpui = "0.2.2"
gpui-component = { git = "https://github.com/longbridge/gpui-component", tag = "v0.5.1" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", tag = "v0.5.1" }
pulldown-cmark = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
